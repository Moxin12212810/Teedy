<div class="row">
    <div class="col-md-4">
        <div class="panel panel-default">
            <div class="panel-heading">
                <h3 class="panel-title">在线用户</h3>
            </div>
            <div class="panel-body">
                <div class="list-group">
                    <a href="" class="list-group-item" ng-repeat="user in users" ng-click="selectChat(user)"
                        ng-class="{'active': currentChat.username === user.username}">
                        <span class="fas fa-user"></span> {{ user.username }}
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="col-md-8">
        <div class="panel panel-default" ng-if="currentChat">
            <div class="panel-heading">
                <h3 class="panel-title">与 {{ currentChat.username }} 聊天中</h3>
            </div>
            <div class="panel-body chat-messages">
                <div class="message" ng-repeat="message in messages | orderBy:'timestamp'">
                    <div ng-class="{'text-right': message.from === 'me'}">
                        <strong>{{ message.from === 'me' ? '我' : message.from }}</strong>
                        <span class="text-muted">{{ message.timestamp | date:'HH:mm:ss' }}</span>
                        <p>{{ message.content }}</p>
                        <small class="text-muted" ng-if="message.from === 'me'">
                            {{ getMessageStatus(message) }}
                        </small>
                    </div>
                </div>
            </div>
            <div class="panel-footer">
                <div class="input-group">
                    <input type="text" class="form-control" ng-model="$parent.message" placeholder="输入消息..."
                        ng-keypress="$event.keyCode === 13 && sendMessage()">
                    <span class="input-group-btn">
                        <button class="btn btn-primary" type="button" ng-click="sendMessage()">
                            发送
                        </button>
                    </span>
                </div>
            </div>
        </div>

        <div class="well text-center" ng-if="!currentChat">
            <p class="text-muted">选择一个用户开始聊天</p>
        </div>
    </div>
</div>

<style>
    .chat-messages {
        height: 400px;
        overflow-y: auto;
        padding: 15px;
    }

    .message {
        margin-bottom: 15px;
    }

    .message p {
        margin: 5px 0;
        word-wrap: break-word;
    }

    .message small {
        display: block;
        margin-top: 2px;
    }
</style>
